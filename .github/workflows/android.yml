# Cloud Android debug APK via Buildozer (no local WSL required).
name: Android APK

on:
  workflow_dispatch:
    inputs:
      clean_cache:
        description: Skip Buildozer cache restore (force cold deps)
        type: boolean
        default: false
  push:
    branches:
      - build-apk

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install headless GUI stack (xvfb + SDL/GL)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libgl1 \
            libgl1-mesa-dri \
            libglx-mesa0 \
            libmtdev1 \
            libsdl2-2.0-0 \
            libsdl2-image-2.0-0 \
            libsdl2-mixer-2.0-0 \
            libsdl2-ttf-2.0-0 \
            libfreetype6 \
            libportmidi0

      - name: Install preflight deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # Core tests need OpenCV (cv2); use headless wheel on CI runners.
          # Kivy for any UI-importing helpers; GUI modules themselves are skipped below.
          python -m pip install "numpy" "pillow" "opencv-python-headless" "kivy"

      - name: Run preflight (no Window / display required)
        env:
          KIVY_NO_ARGS: "1"
          COLORSIGHT_HEADLESS: "1"
        run: python tools/preflight.py

      - name: Unit tests under xvfb
        env:
          KIVY_NO_ARGS: "1"
          KIVY_NO_CONSOLELOG: "0"
          COLORSIGHT_HEADLESS: "1"
          COLORSIGHT_FAKE_CAMERA: "1"
          # Skip GUI modules on CI (run those locally / under a real display).
          # Avoids flaky Window/OpenGL aborts; core + image-pipeline always run.
          COLORSIGHT_SKIP_GUI: "1"
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x800x24" python tools/run_unit_tests.py

      - name: Preflight summary
        if: always()
        run: |
          {
            echo "## Preflight"
            echo "- preflight.py (static / no Window)"
            echo "- unit tests via \`xvfb-run\` + opencv-python-headless"
            echo "- COLORSIGHT_SKIP_GUI=1 (GUI smokes local-only)"
            echo "- Python: 3.11"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          set -euo pipefail
          echo "Before:"
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean || true
          echo "After:"
          df -h

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install apt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      - name: Install Buildozer + Cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer" "cython==0.29.36"

      - name: Cache Buildozer / p4a
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.clean_cache != true }}
        uses: actions/cache@v6
        with:
          path: |
            ~/.buildozer
            ./.buildozer
            !.buildozer/android/platform/build-*/build/venv
          # v2: never restore/save poisoned p4a build/venv (pip capture_logging crash)
          # Include camerax_provider so CameraX hook changes bust the cache.
          key: buildozer-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'constraints.txt', 'camerax_provider/**') }}
          restore-keys: |
            buildozer-v2-${{ runner.os }}-

      - name: Note clean_cache
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.clean_cache == true }}
        run: echo "clean_cache=true — skipped Buildozer cache restore"

      - name: Show PIP_CONSTRAINT
        run: |
          set -euo pipefail
          echo "PIP_CONSTRAINT=${{ github.workspace }}/constraints.txt"
          echo "--- constraints.txt ---"
          cat constraints.txt

      # p4a runs `python -m venv` over an existing build/venv and corrupts pip
      # (ImportError: capture_logging). Keep other_builds / python-installs cached.
      - name: Remove p4a build venv before build
        run: |
          set -euo pipefail
          rm -rf .buildozer/android/platform/build-*/build/venv
          echo "Cleared p4a build/venv (if any); rest of .buildozer kept"

      - name: Build debug APK
        id: build
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/constraints.txt
        run: |
          set -euo pipefail
          mkdir -p bin dist
          echo "PIP_CONSTRAINT=${PIP_CONSTRAINT}"
          buildozer -v android debug 2>&1 | tee buildozer-ci.log
          ls -la bin/*.apk

      # Upload even if the packaging check fails so a built APK is never hidden.
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: colorsight-apk
          path: bin/*.apk
          if-no-files-found: ignore

      - name: Verify FileProvider + Camera in APK
        id: verify
        if: success()
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(bin/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No APK found under bin/ to verify"
            echo "verify_result=no_apk" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          APK="${apks[0]}"
          echo "Checking FileProvider + CAMERA + CameraX in $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "apk_name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          echo "apk_size=$(wc -c < "$APK" | tr -d ' ')" >> "$GITHUB_OUTPUT"

          SDK_ROOT="${HOME}/.buildozer/android/platform/android-sdk"
          AAPT=""
          if [ -d "$SDK_ROOT/build-tools" ]; then
            AAPT=$(ls -d "$SDK_ROOT"/build-tools/*/aapt 2>/dev/null | sort -V | tail -n 1 || true)
          fi

          # Write dump to a file first — never use `echo | grep` under pipefail
          # (Broken pipe makes `! pipeline` a false failure).
          : > apk_manifest_dump.txt
          if [ -n "$AAPT" ] && [ -x "$AAPT" ]; then
            "$AAPT" dump xmltree "$APK" AndroidManifest.xml > apk_manifest_dump.txt 2>/dev/null || true
          fi
          if [ ! -s apk_manifest_dump.txt ]; then
            unzip -p "$APK" AndroidManifest.xml 2>/dev/null | strings > apk_manifest_dump.txt || true
          fi
          head -n 60 apk_manifest_dump.txt || true

          FAIL=0
          FP_OK=fail
          CAM_OK=fail
          CX_OK=fail
          if grep -qi "fileprovider" apk_manifest_dump.txt; then
            FP_OK=ok
          else
            echo "::error::FileProvider missing from APK AndroidManifest.xml — share will fail on device"
            FAIL=1
          fi
          if grep -qi "CAMERA" apk_manifest_dump.txt; then
            CAM_OK=ok
          else
            echo "::error::CAMERA permission missing from APK AndroidManifest.xml — live camera will fail"
            FAIL=1
          fi

          # CameraX provider classes in any classes*.dex (file-based grep, no pipes)
          : > apk_dex_strings.txt
          mapfile -t DEXES < <(unzip -Z1 "$APK" | grep -E '\.dex$' || true)
          for dex in "${DEXES[@]}"; do
            unzip -p "$APK" "$dex" 2>/dev/null | strings >> apk_dex_strings.txt || true
          done
          { grep -iE 'camerax|androidx\.camera|org\.kivy\.camerax' apk_dex_strings.txt | head -n 20 || true; } \
            > camerax_strings.txt || true
          head -n 20 camerax_strings.txt || true

          if grep -qiE 'androidx\.camera|org\.kivy\.camerax|CameraX' apk_dex_strings.txt; then
            CX_OK=ok
          else
            echo "::error::CameraX provider classes missing from APK — copy camerax_provider and check p4a.hook"
            FAIL=1
          fi

          echo "check_fileprovider=$FP_OK" >> "$GITHUB_OUTPUT"
          echo "check_camera=$CAM_OK" >> "$GITHUB_OUTPUT"
          echo "check_camerax=$CX_OK" >> "$GITHUB_OUTPUT"

          if [ "$FAIL" -ne 0 ]; then
            echo "verify_result=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "verify_result=ok" >> "$GITHUB_OUTPUT"
          echo "FileProvider + CAMERA + CameraX OK"

      - name: Upload APK packaging check dump
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apk-packaging-check
          path: |
            apk_manifest_dump.txt
            apk_dex_strings.txt
            camerax_strings.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Prepare logs
        if: always()
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          if [ -f buildozer-ci.log ]; then
            tail -n 1500 buildozer-ci.log > ci-logs/buildozer-tail.txt
            cp buildozer-ci.log ci-logs/buildozer-full.log
          else
            echo "No buildozer-ci.log captured" > ci-logs/buildozer-tail.txt
          fi
          find .buildozer -name "*.log" -type f 2>/dev/null | head -20 | while read -r f; do
            base=$(basename "$f")
            tail -n 200 "$f" > "ci-logs/extra-${base}.txt" || true
          done

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: colorsight-build-logs
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Job summary
        if: always()
        run: |
          set -euo pipefail
          APK_NAME="${{ steps.verify.outputs.apk_name }}"
          APK_SIZE="${{ steps.verify.outputs.apk_size }}"
          VERIFY="${{ steps.verify.outputs.verify_result }}"
          FP="${{ steps.verify.outputs.check_fileprovider }}"
          CAM="${{ steps.verify.outputs.check_camera }}"
          CX="${{ steps.verify.outputs.check_camerax }}"

          # Versions from buildozer.spec / environment (best-effort)
          API=$(grep -E '^android.api\s*=' buildozer.spec | head -1 | sed 's/.*=\s*//')
          NDK=$(grep -E '^android.ndk\s*=' buildozer.spec | head -1 | sed 's/.*=\s*//')
          ARCH=$(grep -E '^android.archs\s*=' buildozer.spec | head -1 | sed 's/.*=\s*//')
          P4A="2026.05.09 (via buildozer default)"
          PY_HOST=$(python -c 'import sys; print(sys.version.split()[0])')

          {
            echo "## Android APK build"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| APK | ${APK_NAME:-_(none)_} |"
            echo "| Size (bytes) | ${APK_SIZE:-_n/a_} |"
            echo "| Host Python | ${PY_HOST} |"
            echo "| python-for-android | ${P4A} |"
            echo "| android.api | ${API} |"
            echo "| android.ndk | ${NDK} |"
            echo "| android.archs | ${ARCH} |"
            echo "| Verify | ${VERIFY:-skipped} |"
            echo "| FileProvider | ${FP:-_} |"
            echo "| CAMERA permission | ${CAM:-_} |"
            echo "| CameraX classes | ${CX:-_} |"
            echo "| clean_cache | ${{ inputs.clean_cache || false }} |"
          } >> "$GITHUB_STEP_SUMMARY"

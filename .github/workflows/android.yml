# Cloud Android debug APK via Buildozer (no local WSL required).
name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - build-apk

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free disk space
        run: |
          set -euo pipefail
          echo "Before:"
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean || true
          echo "After:"
          df -h

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install apt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      - name: Install Buildozer + Cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer" "cython==0.29.36"

      - name: Cache Buildozer / p4a
        uses: actions/cache@v5
        with:
          path: |
            ~/.buildozer
            ./.buildozer
            !.buildozer/android/platform/build-*/build/venv
          # v2: never restore/save poisoned p4a build/venv (pip capture_logging crash)
          key: buildozer-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'constraints.txt') }}
          restore-keys: |
            buildozer-v2-${{ runner.os }}-

      - name: Show PIP_CONSTRAINT
        run: |
          set -euo pipefail
          echo "PIP_CONSTRAINT=${{ github.workspace }}/constraints.txt"
          echo "--- constraints.txt ---"
          cat constraints.txt

      # p4a runs `python -m venv` over an existing build/venv and corrupts pip
      # (ImportError: capture_logging). Keep other_builds / python-installs cached.
      - name: Remove p4a build venv before build
        run: |
          set -euo pipefail
          rm -rf .buildozer/android/platform/build-*/build/venv
          echo "Cleared p4a build/venv (if any); rest of .buildozer kept"

      - name: Build debug APK
        id: build
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/constraints.txt
        run: |
          set -euo pipefail
          mkdir -p bin dist
          echo "PIP_CONSTRAINT=${PIP_CONSTRAINT}"
          buildozer -v android debug 2>&1 | tee buildozer-ci.log
          ls -la bin/*.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: colorsight-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Verify FileProvider + Camera in APK
        if: success()
        run: |
          set -euo pipefail
          APK=$(ls bin/*.apk | head -n 1)
          echo "Checking FileProvider + CAMERA + CameraX in $APK"
          SDK_ROOT="${HOME}/.buildozer/android/platform/android-sdk"
          AAPT=""
          if [ -d "$SDK_ROOT/build-tools" ]; then
            AAPT=$(ls -d "$SDK_ROOT"/build-tools/*/aapt 2>/dev/null | sort -V | tail -n 1 || true)
          fi
          DUMP=""
          if [ -n "$AAPT" ] && [ -x "$AAPT" ]; then
            DUMP=$("$AAPT" dump xmltree "$APK" AndroidManifest.xml || true)
          fi
          if [ -z "$DUMP" ]; then
            DUMP=$(unzip -p "$APK" AndroidManifest.xml | strings || true)
          fi
          echo "$DUMP" | tee apk_manifest_dump.txt | head -n 60

          FAIL=0
          if ! echo "$DUMP" | grep -qi "fileprovider"; then
            echo "::error::FileProvider missing from APK AndroidManifest.xml — share will fail on device"
            FAIL=1
          fi
          if ! echo "$DUMP" | grep -qi "CAMERA"; then
            echo "::error::CAMERA permission missing from APK AndroidManifest.xml — live camera will fail"
            FAIL=1
          fi

          # CameraX provider: Java classes from camerax_provider / androidx.camera
          STRINGS=$(unzip -l "$APK" | head -n 5; unzip -p "$APK" classes.dex 2>/dev/null | strings || true)
          # Also scan all dex + lib entries
          for dex in $(unzip -l "$APK" | awk '/\.dex$/ {print $4}'); do
            STRINGS="$STRINGS"$'\n'"$(unzip -p "$APK" "$dex" | strings || true)"
          done
          echo "$STRINGS" | grep -E -i 'camerax|androidx.camera|org.kivy.camerax' | head -n 20 \
            | tee camerax_strings.txt || true
          if ! echo "$STRINGS" | grep -qiE 'androidx.camera|org\.kivy\.camerax|CameraX'; then
            echo "::error::CameraX provider classes missing from APK — copy camerax_provider and check p4a.hook"
            FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          echo "FileProvider + CAMERA + CameraX OK"

      - name: Upload APK packaging check dump
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: apk-packaging-check
          path: |
            apk_manifest_dump.txt
            camerax_strings.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Prepare failure logs
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p ci-failure
          if [ -f buildozer-ci.log ]; then
            tail -n 1500 buildozer-ci.log > ci-failure/buildozer-tail.txt
            cp buildozer-ci.log ci-failure/buildozer-full.log
          else
            echo "No buildozer-ci.log captured" > ci-failure/buildozer-tail.txt
          fi
          find .buildozer -name "*.log" -type f 2>/dev/null | head -20 | while read -r f; do
            base=$(basename "$f")
            tail -n 200 "$f" > "ci-failure/extra-${base}.txt" || true
          done

      - name: Upload failure log tail
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: colorsight-build-failure-log
          path: ci-failure/buildozer-tail.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Upload full build log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: colorsight-build-full-log
          path: buildozer-ci.log
          if-no-files-found: warn
          retention-days: 3
